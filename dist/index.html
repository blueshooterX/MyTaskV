<script>
    /**
     * Rich Text Editor Component (Reusable)
     */

    const RichTextEditor = {
        focusedRange: null,

        init: function (editorId, toolbarId) {
            const editor = document.getElementById(editorId);

            editor.addEventListener('blur', () => {
                const sel = window.getSelection();
                if (sel.rangeCount > 0) {
                    this.focusedRange = sel.getRangeAt(0);
                }
            });

            const buttons = document.querySelectorAll(`#${toolbarId} button[data-cmd]`);
            buttons.forEach(btn => {
                btn.onclick = (e) => {
                    e.preventDefault();
                    this.restoreFocus(editor);
                    const cmd = btn.dataset.cmd;
                    document.execCommand(cmd, false, null);
                };
            });
        },

        restoreFocus: function (editorElement) {
            editorElement.focus();
            if (this.focusedRange) {
                const sel = window.getSelection();
                sel.removeAllRanges();
                sel.addRange(this.focusedRange);
            }
        },

        applyColor: function (editorId, color) {
            const editor = document.getElementById(editorId);
            this.restoreFocus(editor);
            document.execCommand('foreColor', false, color);
        },

        getHtml: function (editorId) {
            return document.getElementById(editorId).innerHTML;
        },

        getRawText: function (editorId) {
            return document.getElementById(editorId).innerText;
        },

        setHtml: function (editorId, html) {
            document.getElementById(editorId).innerHTML = html;
        },

        clear: function (editorId) {
            document.getElementById(editorId).innerHTML = '';
        },

        getRichTextData: function (editorId) {
            const editor = document.getElementById(editorId);
            const text = [];
            const runs = [];
            let currentOffset = 0;

            function addNewline() {
                text.push('\n');
                runs.push({
                    start: currentOffset,
                    end: currentOffset + 1,
                    style: {} // Neutral style to prevent color bleeding
                });
                currentOffset += 1;
            }

            function hasTrailingNewline() {
                if (text.length === 0) return true; // Treat start as having "newline"
                const lastStr = text[text.length - 1];
                return lastStr.length > 0 && lastStr[lastStr.length - 1] === '\n';
            }

            function walk(node, style) {
                if (node.nodeType === Node.TEXT_NODE) {
                    const content = node.textContent;
                    if (content.length > 0) {
                        text.push(content);
                        runs.push({
                            start: currentOffset,
                            end: currentOffset + content.length,
                            style: { ...style }
                        });
                        currentOffset += content.length;
                    }
                } else if (node.nodeType === Node.ELEMENT_NODE) {
                    const tagName = node.tagName.toLowerCase();

                    if (tagName === 'br') {
                        addNewline();
                        return;
                    }

                    // Check if block element
                    const display = window.getComputedStyle(node).display;
                    // NOTE: Treating 'flex' as block for this editor context.
                    // If complex flex layouts are introduced later, this might need review.
                    const isVisualBlock = display === 'block' || display === 'list-item' || display === 'flex';
                    const isSemanticBlock = ['div', 'p', 'li', 'ul', 'ol', 'h1', 'h2', 'h3', 'blockquote'].includes(tagName);
                    const isBlock = isVisualBlock || isSemanticBlock;

                    // Pre-block newline check
                    if (isBlock && !hasTrailingNewline()) {
                        addNewline();
                    }

                    // Clone style for children
                    const newStyle = { ...style };

                    // Parse styles
                    if (tagName === 'b' || tagName === 'strong' || node.style.fontWeight === 'bold' || parseInt(node.style.fontWeight) >= 700) newStyle.bold = true;
                    if (tagName === 'i' || tagName === 'em' || node.style.fontStyle === 'italic') newStyle.italic = true;
                    if (tagName === 'u' || node.style.textDecoration.includes('underline')) newStyle.underline = true;
                    if (tagName === 's' || tagName === 'strike' || node.style.textDecoration.includes('line-through')) newStyle.strikethrough = true;

                    if (node.style.color) newStyle.color = node.style.color;
                    if (node.color) newStyle.color = node.color; // <font color="...">

                    // Child nodes
                    node.childNodes.forEach(child => walk(child, newStyle));

                    // Post-block newline check
                    if (isBlock && !hasTrailingNewline()) {
                        addNewline();
                    }
                }
            }

            // Start walk from children to avoid treating the editor container itself as a block adding newlines
            editor.childNodes.forEach(child => walk(child, {}));

            // Merge adjacent runs with same style? GAS might handle many small runs fine, or we can optimize.
            // Optimization: If style is identical to previous, extend end.
            const optimizedRuns = [];
            if (runs.length > 0) {
                let current = runs[0];
                for (let i = 1; i < runs.length; i++) {
                    const next = runs[i];
                    // Compare styles (simple JSON stringify is enough for this flat structure)
                    if (current.end === next.start && JSON.stringify(current.style) === JSON.stringify(next.style)) {
                        current.end = next.end;
                    } else {
                        optimizedRuns.push(current);
                        current = next;
                    }
                }
                optimizedRuns.push(current);
            }

            return {
                text: text.join(''),
                runs: optimizedRuns
            };
        }
    };
</script>

<script>
    /**
     * Kanban View Logic
     */

    // Labels: '' = none. Legacy emoji labels are read as the matching monochrome glyph.
    const LABELS = ['', '★', '⚑', '◆', '♥'];
    const LABEL_GLYPHS = ['☆', '★', '⚑', '◆', '♥︎'];
    const LEGACY_LABELS = { '⭐': '★', '⚠️': '⚑', '⚠': '⚑', '💥': '◆', '🩷': '♥' };
    const LABEL_SYM_H = 18;
    const DUE_WINDOW_DAYS = 14;

    function normalizeLabel(value) {
        if (LABELS.includes(value)) return value;
        return LEGACY_LABELS[value] || '';
    }

    function renderBoard() {
        const board = document.getElementById('kanban-container');
        const snapshot = Motion.capture(board);
        const containers = {
            '未着手': document.getElementById('backlog'),
            '実施中': document.getElementById('wip'),
            '保留': document.getElementById('pending'),
            '完了': document.getElementById('done')
        };

        // Clear
        Object.values(containers).forEach(c => c.innerHTML = '');

        const filtered = state.tasks.filter(t => {
            const matchGroup = !state.filter.group || t.group === state.filter.group;
            const matchPriority = !state.filter.priority || t.priority === state.filter.priority;
            return matchGroup && matchPriority;
        });

        // Group by status
        const statusGroups = { '未着手': [], '実施中': [], '保留': [], '完了': [] };
        filtered.forEach(t => { if (statusGroups[t.status]) statusGroups[t.status].push(t); });

        Object.entries(statusGroups).forEach(([status, tasks]) => {
            const list = containers[status];
            const sortMode = state.columnSort[status];

            // Sort
            tasks.sort((a, b) => {
                if (sortMode === 'priority') {
                    const order = { '高': 1, '中': 2, '低': 3 };
                    return (order[a.priority] || 99) - (order[b.priority] || 99);
                } else if (sortMode === 'group') {
                    return (a.group || '').localeCompare(b.group || '', 'ja');
                } else if (sortMode === 'dueDate') {
                    if (!a.dueDate) return 1;
                    if (!b.dueDate) return -1;
                    return new Date(a.dueDate) - new Date(b.dueDate);
                } else if (sortMode === 'updated') {
                    if (!a.updatedAt) return 1;
                    if (!b.updatedAt) return -1;
                    return new Date(b.updatedAt) - new Date(a.updatedAt);
                }
                // default
                return (a.no || 0) - (b.no || 0);
            });

            tasks.forEach(task => {
                const card = createCardElement(task);
                list.appendChild(card);
            });

            // Update count
            const column = list.parentElement;
            column.querySelector('.count').innerText = tasks.length;
            renderColumnFresh(column, tasks);
            renderPriorityBar(column.querySelector('.priority-bar'), tasks);
        });

        board.classList.toggle('show-detail', state.showDetail);
        Motion.play(snapshot, board);
    }

    function renderColumnFresh(column, tasks) {
        const heading = column.querySelector('.column-header h2');
        const badge = heading.querySelector('.col-fresh') || heading.appendChild(Object.assign(document.createElement('span'), { className: 'col-fresh' }));
        const freshCount = tasks.filter(t => t.updatedAt && daysSince(t.updatedAt) === 0).length;
        badge.textContent = freshCount ? `+${freshCount} TODAY` : '';
        badge.title = `今日更新: ${freshCount}件`;
    }

    function renderPriorityBar(bar, tasks) {
        const segments = [['高', 'high'], ['中', 'middle'], ['低', 'low']]
            .map(([label, key]) => ({ label, key, count: tasks.filter(t => t.priority === label).length }))
            .filter(s => s.count > 0);
        bar.innerHTML = segments
            .map(s => `<span class="pb-seg pb-${s.key}" style="flex:${s.count}" title="優先度${s.label}: ${s.count}件"></span>`)
            .join('');
    }

    /**
     * Freshness style based on last update
     * - today: live glow / 1-2 days: label only / 3-6 days: desaturated / 7+ days: dimmed (+IDLE badge for 実施中)
     */
    function getFreshness(task) {
        const none = { cls: '', badge: '' };
        if (!task.updatedAt || task.status === '完了') return none;
        const days = daysSince(task.updatedAt);
        if (days === null) return none;
        if (days <= 0) return { cls: 'fresh-today', badge: '<span class="fresh-badge" title="今日更新"><i class="dot"></i>今日更新</span>' };
        if (days < 3) return { cls: 'fresh-recent', badge: `<span class="recent-badge" title="最終更新から${days}日">${days === 1 ? '昨日' : '2日前'}</span>` };
        if (days >= 7 && task.status === '実施中') {
            return { cls: 'dormant', badge: `<span class="dormant-badge" title="最終更新から${days}日"><i class="dot"></i>IDLE ${days}日</span>` };
        }
        return { cls: 'stale', badge: '' };
    }

    /** Due gauge (remaining days over a 14-day window) and overdue state, for open tasks only */
    function getDueInfo(task) {
        const none = { cls: '', overdue: false, gauge: '' };
        if (!task.dueDate || task.status === '完了') return none;
        const passed = daysSince(task.dueDate);
        if (passed === null) return none;
        const left = -passed;
        const ratio = Math.min(1, Math.max(0, left / DUE_WINDOW_DAYS));
        const color = ratio > 0.5 ? 'var(--priority-low)' : ratio > 0.2 ? 'var(--priority-middle)' : 'var(--priority-high)';
        return {
            cls: left < 0 ? 'has-due boss' : 'has-due',
            overdue: left < 0,
            gauge: `<span class="card-gauge" aria-hidden="true" title="期限まで残り${Math.max(0, left)}日"><i style="width:${ratio * 100}%;background:${color}"></i></span>`
        };
    }

    function buildProgressHtml(contentRaw) {
        const MAX_DOTS = 7;
        const entries = parseProgressEntries(contentRaw);
        if (entries.length === 0) return '';

        const shown = entries.slice(-MAX_DOTS);
        const latest = shown[shown.length - 1];
        const dots = shown.map((e, i) => {
            const age = daysSince(e.date.toISOString());
            const cls = [i === shown.length - 1 ? 'latest' : '', age !== null && age <= 3 ? 'recent' : ''].join(' ');
            return `<span class="progress-dot ${cls}" title="${escapeHtml(e.text)}"></span>`;
        }).join('<span class="progress-link"></span>');

        return `<div class="card-progress">
            <span class="progress-dots">${dots}</span>
            <span class="progress-meta">LOG ${entries.length} · 最終 ${latest.date.getMonth() + 1}/${latest.date.getDate()}</span>
        </div>`;
    }

    /** Footer row: freshness badge (left) + progress dots (right). Omitted when both are empty. */
    function buildFooterHtml(badgeHtml, progressHtml) {
        if (!badgeHtml && !progressHtml) return '';
        return `<div class="card-footer">${badgeHtml}${progressHtml}</div>`;
    }

    /** Mark task as touched on the client (optimistic) */
    function touchTask(task, type) {
        task.updatedAt = new Date().toISOString();
        Activity.record(type, task);
    }

    function createCardElement(task) {
        const div = document.createElement('div');
        const priorityMap = (state.mapping && state.mapping.PRIORITY) || {};
        const priorityClass = `priority-${priorityMap[task.priority] || 'middle'}`;
        const freshness = getFreshness(task);
        const due = getDueInfo(task);

        div.className = ['task-card', priorityClass, freshness.cls, due.cls].filter(Boolean).join(' ');
        div.dataset.id = task.id;
        div.dataset.status = task.status;

        const dateStr = task.dueDate ? new Date(task.dueDate).toLocaleDateString('ja-JP') : '';
        const groupColor = generateColorFromHash(task.group);

        const label = normalizeLabel(task.label);
        const labelIdx = LABELS.indexOf(label);
        const strip = [...LABEL_GLYPHS, ...LABEL_GLYPHS, ...LABEL_GLYPHS].map(s => `<span class="label-sym">${s}</span>`).join('');
        const checkClass = task.status === '完了' ? 'completed' : '';

        div.innerHTML = `
    <span class="reticle" aria-hidden="true"></span>
    <div class="card-face">
      <span class="card-glare" aria-hidden="true"></span>
      ${due.gauge}
      <div class="card-header-row">
        <span class="card-label ${label ? 'active' : 'inactive'}" title="ラベル"><span class="label-strip" style="transform: translateY(${-(5 + labelIdx) * LABEL_SYM_H}px)">${strip}</span></span>
        <div class="card-group" style="--gc: ${groupColor}">${task.group || 'なし'}</div>
        <div class="card-title">${task.title}</div>
        <span class="boss-tag">OVERDUE</span>
        <div class="card-due ${due.overdue ? 'overdue' : ''}">${dateStr}</div>
        <span class="card-check material-icons ${checkClass}" title="${task.status === '完了' ? '実施中に戻す' : '完了にする'}">check</span>
      </div>
      <div class="card-preview"></div>
      <div class="card-content">${task.contentHtml}</div>
      ${buildFooterHtml(freshness.badge, buildProgressHtml(task.contentRaw))}
    </div>
`;
        // Process content with link chips (Drive links show type icon + file name)
        DriveLinks.requestFromText(task.contentRaw);
        const processedHtml = (task.contentHtml || '').replace(
            /(https?:\/\/[^\s<]+)/g,
            (escapedUrl) => DriveLinks.buildChip(unescapeHtml(escapedUrl), 'full')
        );
        div.querySelector('.card-content').innerHTML = processedHtml;

        // Preview: plain text with compact chips
        div.querySelector('.card-preview').innerHTML = String(task.contentRaw || '')
            .split(/(https?:\/\/[^\s]+)/g)
            .map((part, i) => (i % 2 === 1 ? DriveLinks.buildChip(part, 'compact') : escapeHtml(part)))
            .join('');

        // Label Click: ☆ (none) → ★ → ⚑ → ◆ → ♥
        div.querySelector('.card-label').onclick = (e) => {
            e.stopPropagation();
            const labelEl = e.currentTarget;
            const prevIdx = LABELS.indexOf(normalizeLabel(task.label));
            const nextIdx = (prevIdx + 1) % LABELS.length;
            task.label = LABELS[nextIdx];
            labelEl.className = `card-label ${task.label ? 'active' : 'inactive'}`;
            Motion.roll(labelEl, prevIdx, nextIdx, LABEL_SYM_H);

            touchTask(task, 'update');
            Motion.savedFlash(div);

            google.script.run
                .withSuccessHandler(() => refreshData(true))
                .withFailureHandler(handleError)
                .saveTask(task);
        };

        // Check Click: transfer to 完了 (or back to 実施中)
        div.querySelector('.card-check').onclick = (e) => {
            e.stopPropagation();
            const toDone = task.status !== '完了';
            Motion.transfer(div, task.id, () => {
                task.status = toDone ? '完了' : '実施中';
                touchTask(task, toDone ? 'complete' : 'reopen');
                renderBoard();
            }, { toDone, crit: toDone && task.priority === '高' });

            google.script.run
                .withSuccessHandler(() => refreshData(true))
                .withFailureHandler(handleError)
                .saveTask(task);
        };

        div.onclick = () => {
            if (Motion.consumeClick()) return;
            openModal(task, div);
        };
        return div;
    }

    function setupDrag() {
        Motion.setupDrag(document.getElementById('kanban-container'), updateAfterDrag);
    }

    function updateAfterDrag() {
        const updates = [];
        const statusCols = document.querySelectorAll('.kanban-column');

        statusCols.forEach(col => {
            const status = col.dataset.status;
            const cards = col.querySelectorAll('.task-card');
            cards.forEach((card, index) => {
                const id = card.dataset.id;
                const no = index + 1;

                // Update state
                const task = state.tasks.find(t => t.id == id);
                if (task) {
                    task.status = status;
                    task.no = no;
                }

                updates.push({ id, status, no });
            });
        });

        state.pendingUpdates = updates;
        state.hasPendingOrderChanges = true;

        if (typeof window.updateSaveBannerVisibility === 'function') {
            window.updateSaveBannerVisibility();
        }

        renderBoard();
    }

    function setupResizers() {
        setupColumnResizer('.resizer', '.kanban-column', document.getElementById('kanban-container'));
    }

    function getUrlIcon(url) {
        if (url.includes('mail.google.com')) return 'email';
        if (url.includes('drive.google.com')) return 'folder';
        if (url.includes('calendar.google.com')) return 'calendar_today';
        if (url.includes('meet.google.com')) return 'videocam';
        return 'link';
    }
</script>

<script>
    /**
     * Task Modal Logic
     */

    let openedTaskData = null;

    /**
     * Close the editor. With a task id, the panel folds back into that card (A4).
     * @param {string|null} cardId
     */
    function closeTaskModal(cardId = openedTaskData ? openedTaskData.id : null) {
        const modal = document.getElementById('taskModal');
        if (!modal.classList.contains('show')) return;
        const content = modal.querySelector('.modal-content');
        const target = cardId !== null ? Motion.findCard(cardId) : null;
        Motion.collapseTo(content, target, () => modal.classList.remove('show'));
    }

    function setupTaskModal() {
        // Modal events
        const modal = document.getElementById('taskModal');
        const closeModal = () => closeTaskModal();

        document.querySelector('.close-modal').onclick = closeModal;
        document.querySelector('.cancel-btn').onclick = closeModal;

        // Close on ESC key
        window.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && modal.classList.contains('show')) {
                closeModal();
            }
        });

        document.getElementById('taskForm').onsubmit = (e) => {
            e.preventDefault();
            saveCurrentTask();
        };

        document.getElementById('deleteTaskBtn').onclick = () => {
            if (confirm('このタスクを削除しますか？')) {
                deleteCurrentTask();
            }
        };

        // Color Picker Logic (integrated with RichTextEditor)
        const colorBtn = document.getElementById('colorBtn');
        const colorMenu = document.getElementById('colorMenu');

        colorBtn.onclick = (e) => {
            e.preventDefault();
            colorMenu.classList.toggle('show');
        };

        document.querySelectorAll('.color-swatch').forEach(swatch => {
            swatch.onclick = (e) => {
                const color = swatch.dataset.color;
                RichTextEditor.applyColor('editor', color);
                colorMenu.classList.remove('show');
                colorBtn.querySelector('.color-bar').style.background = color;
            };
        });

        window.addEventListener('click', (e) => {
            if (!colorBtn.contains(e.target)) colorMenu.classList.remove('show');
        });
    }

    /**
     * @param {object|null} task
     * @param {HTMLElement|null} sourceEl card the editor expands from (A4)
     */
    function openModal(task = null, sourceEl = null) {
        const form = document.getElementById('taskForm');
        const modal = document.getElementById('taskModal');
        const title = document.getElementById('modalTitle');

        form.reset();
        RichTextEditor.clear('editor');
        document.getElementById('deleteTaskBtn').style.display = task ? 'block' : 'none';

        if (task) {
            title.innerText = 'タスク編集';
            document.getElementById('taskId').value = task.id;
            document.getElementById('taskGroupInput').value = task.group;
            document.getElementById('taskPriorityInput').value = task.priority;
            document.getElementById('taskTitleInput').value = task.title;
            RichTextEditor.setHtml('editor', task.contentHtml);
            document.getElementById('taskDueDateInput').value = task.dueDate ? task.dueDate.split('T')[0] : '';
            document.getElementById('taskStatusInput').value = task.status;

            // Keep original data for change detection
            openedTaskData = {
                id: task.id,
                group: task.group,
                priority: task.priority,
                title: task.title,
                contentHtml: task.contentHtml,
                dueDate: task.dueDate ? task.dueDate.split('T')[0] : '',
                status: task.status
            };
        } else {
            title.innerText = '新規タスク追加';
            document.getElementById('taskId').value = '';
            openedTaskData = null;
        }

        modal.classList.add('show');
        Motion.sfx.play('blip');
        Motion.expandFrom(modal.querySelector('.modal-content'), sourceEl);
    }

    function saveCurrentTask() {
        const id = document.getElementById('taskId').value;
        const task = {
            id: id,
            group: document.getElementById('taskGroupInput').value,
            priority: document.getElementById('taskPriorityInput').value,
            title: document.getElementById('taskTitleInput').value,
            contentHtml: RichTextEditor.getHtml('editor'),
            contentRaw: RichTextEditor.getRawText('editor'),
            richTextData: RichTextEditor.getRichTextData('editor'),
            dueDate: document.getElementById('taskDueDateInput').value,
            status: document.getElementById('taskStatusInput').value,
            _contentModified: !openedTaskData || RichTextEditor.getHtml('editor') !== openedTaskData.contentHtml
        };

        // If nothing changed, just close modal
        if (openedTaskData &&
            task.group === openedTaskData.group &&
            task.priority === openedTaskData.priority &&
            task.title === openedTaskData.title &&
            task.contentHtml === openedTaskData.contentHtml &&
            task.dueDate === openedTaskData.dueDate &&
            task.status === openedTaskData.status) {
            closeTaskModal();
            return;
        }
        const becameHigh = task.priority === '高' && (!openedTaskData || openedTaskData.priority !== '高');

        // --- Optimistic Update ---
        const originalTasks = JSON.parse(JSON.stringify(state.tasks));
        const activityType = openedTaskData ? Activity.classify(openedTaskData.status, task.status) : 'create';

        if (id) {
            // Edit mode: Update existing task in state
            const index = state.tasks.findIndex(t => t.id == id);
            if (index !== -1) {
                state.tasks[index] = { ...state.tasks[index], ...task };
                touchTask(state.tasks[index], activityType);
            }
            state.justSavedId = id;
        } else {
            // New mode: Prepend temporary task
            const tempTask = {
                ...task,
                id: 'temp_' + Date.now(),
                no: 0 // Will be corrected by refresh
            };
            state.tasks.unshift(tempTask);
            touchTask(tempTask, activityType);
            state.justSavedId = tempTask.id;
        }

        renderBoard();
        const savedId = state.justSavedId;
        state.justSavedId = null;
        closeTaskModal(savedId);
        setTimeout(() => {
            const card = Motion.findCard(savedId);
            Motion.savedFlash(card);
            if (becameHigh) Motion.glitch(card);
        }, Motion.on('A4') ? 340 : 0);

        // Background save
        google.script.run
            .withSuccessHandler((res) => {
                // If it was a new task, we need the real ID for subsequent operations
                if (!id && res.id) {
                    const t = state.tasks.find(t => t.id.toString().startsWith('temp_'));
                    if (t) {
                        Motion.aliasId(t.id, res.id);
                        t.id = res.id;
                    }
                }
                refreshData(true); // Silent sync
            })
            .withFailureHandler(err => {
                // Rollback on failure
                state.tasks = originalTasks;
                renderBoard();
                handleError(err);
            })
            .saveTask(task);
    }

    function deleteCurrentTask() {
        const id = document.getElementById('taskId').value;
        showLoading('loading-overlay', true);
        google.script.run
            .withSuccessHandler(() => {
                closeTaskModal(null);
                refreshData();
            })
            .withFailureHandler(handleError)
            .deleteTask(id);
    }
</script>

<script>
    /**
     * Main Client Controller
     */

    const state = {
        tasks: [],
        mapping: {},
        filter: { group: '', priority: '' },
        columnSort: {
            '未着手': 'default',
            '実施中': 'default',
            '保留': 'default',
            '完了': 'default'
        },
        showDetail: true,
        showDone: false,
        hasPendingOrderChanges: false,
        pendingUpdates: [],
        isSavingOrder: false,
        justSavedId: null
    };

    // Default column width ratio (focus on 実施中)
    const COLUMN_FLEX = { '未着手': 1, '実施中': 3, '保留': 1, '完了': 1 };

    // Initial Load
    window.onload = () => {
        Motion.init();
        RichTextEditor.init('editor', 'editorToolbar');
        setupEventListeners();
        setupDrag();
        setupResizers();
        setupTaskModal();
        Activity.setup();
        Hud.setup();

        // Initial UI State check
        updateDoneVisibility();
        updateDetailButton();

        // Load Data and Settings (the boot sequence replaces the loading overlay when enabled)
        const booting = Motion.boot.start();
        refreshData(booting);

        google.script.run.withSuccessHandler(settings => {
            state.mapping = settings.mapping;
            document.getElementById('appVersion').innerText = settings.version || '';
            // Priority classes depend on the mapping; re-render if tasks arrived first
            if (state.tasks.length) renderBoard();
        }).getSettings();
    };

    function initialize(data) {
        state.tasks = data;
        updateDataLists();
        renderBoard();
        Motion.boot.step('data', data.length);
    }

    function refreshData(silent = false) {
        if (!silent) showLoading('loading-overlay', true);
        google.script.run
            .withSuccessHandler(data => {
                // Merge pending order and status changes if any exist in memory
                if (state.hasPendingOrderChanges) {
                    data.forEach(fetchedTask => {
                        const pending = state.pendingUpdates.find(u => u.id == fetchedTask.id);
                        if (pending) {
                            fetchedTask.status = pending.status;
                            fetchedTask.no = pending.no;
                        }
                    });
                }
                initialize(data);
                showLoading('loading-overlay', false);
            })
            .withFailureHandler(handleError)
            .getData();
        Activity.load();
    }

    function updateDataLists() {
        const groups = [...new Set(state.tasks.map(t => t.group).filter(Boolean))];
        const filterSelect = document.getElementById('filterGroup');
        const datalist = document.getElementById('groupOptions');

        // Filter HTML
        const currentFilter = filterSelect.value;
        filterSelect.innerHTML = '<option value="">全グループ</option>' +
            groups.map(g => `<option value="${g}" ${g === currentFilter ? 'selected' : ''}>${g}</option>`).join('');

        // Modal Input Candidates
        datalist.innerHTML = groups.map(g => `<option value="${g}">`).join('');
    }

    function setupEventListeners() {
        // Filter
        document.getElementById('filterGroup').onchange = (e) => {
            state.filter.group = e.target.value;
            renderBoard();
        };
        document.getElementById('filterPriority').onchange = (e) => {
            state.filter.priority = e.target.value;
            renderBoard();
        };

        // Column Sort
        document.querySelectorAll('.column-sort').forEach(sel => {
            sel.onchange = (e) => {
                const status = e.target.dataset.status;
                state.columnSort[status] = e.target.value;
                renderBoard();
            };
        });

        // Toggle Detail
        window.updateDetailButton = () => {
            const btn = document.getElementById('toggleDetailBtn');
            if (state.showDetail) {
                btn.innerText = '詳細：表示';
                btn.classList.add('primary');
                btn.classList.remove('secondary');
            } else {
                btn.innerText = '詳細：非表示';
                btn.classList.remove('primary');
                btn.classList.add('secondary');
            }
        };
        document.getElementById('toggleDetailBtn').onclick = () => {
            state.showDetail = !state.showDetail;
            updateDetailButton();
            renderBoard();
        };

        // Toggle Done Column
        const doneColumn = document.querySelector('.kanban-column[data-status="完了"]');

        window.updateDoneVisibility = () => {
            const btn = document.getElementById('toggleDoneBtn');
            // Reset widths
            document.querySelectorAll('.kanban-column').forEach(col => {
                col.style.width = '';
                col.style.flex = `${COLUMN_FLEX[col.dataset.status] || 1} 1 0`;
            });

            if (state.showDone) {
                doneColumn.classList.remove('hidden');
                btn.innerText = '完了：表示';
                btn.classList.add('primary');
                btn.classList.remove('secondary');
            } else {
                doneColumn.classList.add('hidden');
                btn.innerText = '完了：非表示';
                btn.classList.remove('primary');
                btn.classList.add('secondary');
            }
        };

        document.getElementById('toggleDoneBtn').onclick = () => {
            state.showDone = !state.showDone;
            window.updateDoneVisibility();
        };

        // Add Task
        document.getElementById('addTaskBtn').onclick = () => openModal();

        // Import Google Tasks
        document.getElementById('importTasksBtn').onclick = () => {
            document.getElementById('dropdownMenu').classList.remove('show');
            showLoading('loading-overlay', true);
            google.script.run
                .withSuccessHandler(res => {
                    refreshData();
                    alert(`${res.count} 件のタスクを抽出しました。`);
                })
                .withFailureHandler(handleError)
                .importFromGoogleTasks();
        };

        // Menu Toggle
        const menuTrigger = document.getElementById('menuTrigger');
        const dropdownMenu = document.getElementById('dropdownMenu');
        menuTrigger.onclick = (e) => {
            e.stopPropagation();
            dropdownMenu.classList.toggle('show');
        };
        window.addEventListener('click', () => {
            dropdownMenu.classList.remove('show');
        });

        // Save Order Button
        document.getElementById('saveOrderBtn').onclick = () => {
            if (state.isSavingOrder || !state.hasPendingOrderChanges) return;

            state.isSavingOrder = true;
            window.updateSaveBannerVisibility();

            google.script.run
                .withSuccessHandler(() => {
                    state.hasPendingOrderChanges = false;
                    state.isSavingOrder = false;
                    state.pendingUpdates = [];
                    window.updateSaveBannerVisibility();
                    refreshData(true);
                })
                .withFailureHandler(err => {
                    state.isSavingOrder = false;
                    window.updateSaveBannerVisibility();
                    handleError(err);
                })
                .updateOrderAndStatus(state.pendingUpdates);
        };

        // Prevent leaving page when there are unsaved changes
        window.addEventListener('beforeunload', (e) => {
            if (state.hasPendingOrderChanges) {
                e.preventDefault();
                e.returnValue = ''; // Standard trigger for modern browsers
            }
        });
    }

    window.updateSaveBannerVisibility = () => {
        const banner = document.getElementById('save-banner');
        if (!banner) return;

        const saveBtn = document.getElementById('saveOrderBtn');

        if (state.hasPendingOrderChanges) {
            banner.classList.add('show');
            if (state.isSavingOrder) {
                saveBtn.disabled = true;
                saveBtn.innerText = '保存中...';
            } else {
                saveBtn.disabled = false;
                saveBtn.innerText = 'スプレッドシートに保存';
            }
        } else {
            banner.classList.remove('show');
        }
    };

    function handleError(err) {
        showLoading('loading-overlay', false);
        Motion.boot.fail(err.message);
        alert('Error: ' + err.message);
        console.error(err);
    }
</script>
<!-- --- END js-main.html --- -->
