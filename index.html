        // 配色はスタイル適用前に決める（読み込み時のちらつき防止）。保存できない環境ではダーク
        (function () {
            var mode = 'auto';
            try { mode = localStorage.getItem('mytask-theme') || 'auto'; } catch (e) { /* storage unavailable */ }
            var prefersLight = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches;
            var ui = mode === 'auto' ? (prefersLight ? 'light' : 'dark') : mode;
            document.documentElement.setAttribute('data-ui', ui);
        })();
    </script>
