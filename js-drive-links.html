<script>
    /**
     * Drive Links: show Google Drive URLs as "[type icon] file name" chips
     */
    const DriveLinks = (() => {
        const KINDS = {
            doc: { icon: 'description', color: '#1A73E8', label: 'ドキュメント' },
            sheet: { icon: 'table_chart', color: '#188038', label: 'スプレッドシート' },
            slides: { icon: 'slideshow', color: '#E37400', label: 'スライド' },
            form: { icon: 'list_alt', color: '#7248B9', label: 'フォーム' },
            drawing: { icon: 'brush', color: '#D93025', label: '図形描画' },
            folder: { icon: 'folder', color: '#5F6368', label: 'フォルダ' },
            pdf: { icon: 'picture_as_pdf', color: '#D93025', label: 'PDF' },
            image: { icon: 'image', color: '#D93025', label: '画像' },
            video: { icon: 'movie', color: '#D93025', label: '動画' },
            file: { icon: 'insert_drive_file', color: '#5F6368', label: 'ファイル' }
        };

        const URL_PATTERNS = [
            { re: /docs\.google\.com\/document\/(?:u\/\d+\/)?d\/([\w-]+)/, kind: 'doc' },
            { re: /docs\.google\.com\/spreadsheets\/(?:u\/\d+\/)?d\/([\w-]+)/, kind: 'sheet' },
            { re: /docs\.google\.com\/presentation\/(?:u\/\d+\/)?d\/([\w-]+)/, kind: 'slides' },
            { re: /docs\.google\.com\/forms\/(?:u\/\d+\/)?d\/(?!e\/)([\w-]+)/, kind: 'form' },
            { re: /docs\.google\.com\/drawings\/(?:u\/\d+\/)?d\/([\w-]+)/, kind: 'drawing' },
            { re: /drive\.google\.com\/(?:drive\/(?:u\/\d+\/)?)?folders\/([\w-]+)/, kind: 'folder' },
            { re: /drive\.google\.com\/file\/(?:u\/\d+\/)?d\/([\w-]+)/, kind: 'file' },
            { re: /drive\.google\.com\/(?:open|uc)\?(?:[^#\s]*?[&;])?id=([\w-]+)/, kind: 'file' }
        ];

        const MIME_KINDS = [
            [/google-apps\.document$|wordprocessingml|msword/, 'doc'],
            [/google-apps\.spreadsheet$|spreadsheetml|ms-excel|text\/csv/, 'sheet'],
            [/google-apps\.presentation$|presentationml|ms-powerpoint/, 'slides'],
            [/google-apps\.form$/, 'form'],
            [/google-apps\.drawing$/, 'drawing'],
            [/google-apps\.folder$/, 'folder'],
            [/^application\/pdf$/, 'pdf'],
            [/^image\//, 'image'],
            [/^video\//, 'video']
        ];

        const cache = {}; // id -> {name, mimeType} | {error} | 'pending'
        let queue = [];
        let flushTimer = null;

        /** @returns {{id: string, kind: string} | null} */
        function parse(url) {
            const hit = URL_PATTERNS.map(p => ({ match: url.match(p.re), kind: p.kind })).find(p => p.match);
            return hit ? { id: hit.match[1], kind: hit.kind } : null;
        }

        function kindFromMime(mimeType) {
            const hit = MIME_KINDS.find(([re]) => re.test(mimeType || ''));
            return hit ? hit[1] : 'file';
        }

        const resolved = id => (cache[id] && cache[id] !== 'pending' ? cache[id] : null);

        /** Queue unresolved IDs found in the text; resolved in one batched server call */
        function requestFromText(text) {
            const ids = (String(text || '').match(/https?:\/\/[^\s<]+/g) || [])
                .map(parse)
                .filter(Boolean)
                .map(d => d.id)
                .filter(id => !(id in cache));
            if (ids.length === 0) return;

            ids.forEach(id => { cache[id] = 'pending'; });
            queue = [...queue, ...ids];
            if (!flushTimer) flushTimer = setTimeout(flush, 50);
        }

        function flush() {
            const ids = queue;
            queue = [];
            flushTimer = null;
            google.script.run
                .withSuccessHandler(res => {
                    Object.assign(cache, res);
                    refreshChips();
                })
                .withFailureHandler(err => {
                    console.error('Driveリンクの解決に失敗しました:', err);
                    ids.forEach(id => { cache[id] = { error: 'failed' }; });
                    refreshChips();
                })
                .resolveDriveLinks(ids);
        }

        /** Re-render chips in place after resolution (no board re-render) */
        function refreshChips() {
            document.querySelectorAll('[data-drive-url]').forEach(el => {
                el.outerHTML = buildChip(el.dataset.driveUrl, el.dataset.chipVariant);
            });
        }

        /**
         * @param {string} url plain (unescaped) URL
         * @param {'full'|'compact'} variant full = clickable link (detail), compact = inline label (preview)
         */
        function buildChip(url, variant) {
            const drive = parse(url);
            const safeUrl = escapeHtml(url);

            if (!drive) {
                const icon = getUrlIcon(url);
                return variant === 'compact'
                    ? `<span class="material-icons preview-inline-icon">${icon}</span>`
                    : `<a href="${safeUrl}" target="_blank" class="url-inline-link" onclick="event.stopPropagation()"><span class="material-icons">${icon}</span>${safeUrl}</a>`;
            }

            const info = resolved(drive.id);
            const kind = info && !info.error ? kindFromMime(info.mimeType) : drive.kind;
            const meta = KINDS[kind] || KINDS.file;
            const stateClass = !info ? 'is-loading' : (info.error ? 'is-error' : '');
            const name = !info ? `${meta.label}を読み込み中…` : (info.error ? `${meta.label}（アクセス不可）` : info.name);
            const attrs = `data-drive-url="${safeUrl}" data-chip-variant="${variant}" title="${escapeHtml(name)}&#10;${safeUrl}"`;
            const inner = `<span class="material-icons" style="color:${meta.color}">${meta.icon}</span><span class="chip-name">${escapeHtml(name)}</span>`;

            return variant === 'compact'
                ? `<span class="drive-chip compact ${stateClass}" ${attrs}>${inner}</span>`
                : `<a href="${safeUrl}" target="_blank" class="url-inline-link drive-chip ${stateClass}" ${attrs} onclick="event.stopPropagation()">${inner}</a>`;
        }

        return { requestFromText, buildChip };
    })();
</script>
